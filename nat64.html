<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NAT64 → RouterOS Address-List Generator</title>
<style>
    body {font-family: monospace; background-color:#f5f5f5; padding:20px;}
    textarea {width:100%; height:260px; font-size:14px; padding:10px;}
    button {font-size:16px; padding:10px 20px; cursor:pointer;}
    h2 {margin-top:20px;}

    /* statistics block */
    .summary {background:#e9ecef; padding:10px 12px; border:1px solid #ccc; margin-top:16px; font-size:14px; white-space:pre-wrap;}

    /* output field + overlay button */
    .out-wrap {position:relative; margin-top:10px; overflow:auto; border:1px solid #ccc; background:#fff;}
    .out-wrap pre {margin:0; padding:12px 48px 12px 12px; font-size:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; background:#fff; max-height:400px; overflow:auto;}
    .line {display:flex; align-items:flex-start;}
    .ln {user-select:none; min-width:48px; flex-shrink:0; padding-right:4px; color:#666;}
    .cmd {flex:1;}

    /* copy button overlay */
    .copy-btn {position:absolute; top:6px; right:6px; background:#007bff; color:#fff; border:none; padding:6px 12px; font-size:13px; border-radius:3px; cursor:pointer; opacity:0; transition:opacity .2s; font-family:inherit; z-index:2;}
    .out-wrap:hover .copy-btn {opacity:1;}
    .copy-btn:hover {background:#0056b3;}
    .copy-btn:disabled {background:#9bb9d6; cursor:not-allowed;}

    .hidden {display:none;}
</style>
</head>
<body>

<h1>NAT64 → RouterOS Address-List Generator</h1>

<textarea id="input">
AS48282
VDSINA-AS, RU
94.103.92.0/24
195.2.80.0/24
2a0d:8480::/48
</textarea><br>

<button onclick="generate()">Generate Commands</button>

<div id="stats" class="summary hidden"></div>

<div id="outputWrapper" class="out-wrap hidden">
    <button id="copyBtn" class="copy-btn" disabled>📋 Copy</button>
    <pre id="output"></pre>
</div>

<script>
function ipv4ToNat64(ip, prefixLen) {
    const parts = ip.split('.').map(Number);
    const hi = (parts[0] << 8 | parts[1]);   // first two octets
    const lo = (parts[2] << 8 | parts[3]);   // last two octets
    return `64:ff9b::${hi.toString(16).padStart(4,'0')}:${lo.toString(16).padStart(4,'0')}/${96 + prefixLen}`;
}

function parseInput(input) {
    const lines = input.trim().split("\n").map(l => l.trim()).filter(Boolean);
    const blocks = [];
    let currentAS = null;

    for (const line of lines) {
        if (/^AS\d+/.test(line)) {
            currentAS = {asn: line, name: "", subnets: []};
            blocks.push(currentAS);
        } else if (!currentAS.name && currentAS.asn && line.includes(',')) {
            currentAS.name = line;
        } else if (currentAS && line.includes('/')) {
            currentAS.subnets.push(line);
        }
    }
    return blocks;
}

function generate() {
    const blocks = parseInput(document.getElementById('input').value);
    const nat64Commands = [];
    const nativeCommands = [];
    let ipv4Count = 0, nativeCount = 0;

    for (const block of blocks) {
        // Comment parts separated by dots: AS number . AS name . subnet
        const commentPrefix = `${block.asn}. ${block.name}.`;

        for (const subnet of block.subnets) {
            const [ip, prefixStr] = subnet.split('/');
            const prefixLen = parseInt(prefixStr, 10);
            const isIPv4 = /^\d+\.\d+\.\d+\.\d+$/.test(ip);

            if (isIPv4 && !isNaN(prefixLen)) {
                ipv4Count++;
                const nat64Address = ipv4ToNat64(ip, prefixLen);
                const comment = `${commentPrefix} ${subnet}`;
                nat64Commands.push(`/ipv6 firewall address-list add address=${nat64Address} comment="${comment}" list=wireguard-ru-dst`);
            } else if (subnet.includes(':')) {
                nativeCount++;
                const comment = `${commentPrefix} ${subnet}`;
                nativeCommands.push(`/ipv6 firewall address-list add address=${subnet} comment="${comment}" disabled=yes list=wireguard-ru-dst`);
            }
        }
    }

    const stats = document.getElementById('stats');
    const wrapper = document.getElementById('outputWrapper');
    const pre = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const totalSubnets = ipv4Count + nativeCount;

    /* Hide everything if no output */
    if (totalSubnets === 0) {
        stats.classList.add('hidden');
        wrapper.classList.add('hidden');
        return;
    }

    /* Show statistics — each item on its own line */
    stats.classList.remove('hidden');
    stats.textContent =
        `AS Number: ${blocks[0]?.asn || 'N/A'}\n` +
        `AS Name: ${blocks[0]?.name || 'N/A'}\n` +
        `IPv4 Subnets: ${ipv4Count}\n` +
        `Native IPv6 Subnets: ${nativeCount}\n` +
        `Total Subnets: ${totalSubnets}`;

    /* Build output HTML: NAT64 first, native IPv6 last */
    const allCommands = [...nat64Commands, ...nativeCommands];
    let html = '';
    allCommands.forEach((cmd, i) => {
        const lineNum = i + 1;
        const esc = cmd.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += `<div class="line"><span class="ln">${lineNum}: </span><span class="cmd">${esc}</span></div>`;
    });
    pre.innerHTML = html;

    wrapper.classList.remove('hidden');
    copyBtn.disabled = false;
}

/* Copy only the command text — line numbers are excluded */
document.getElementById('copyBtn').addEventListener('click', async () => {
    const cmdSpans = document.querySelectorAll('#output .cmd');
    const commands = [...cmdSpans].map(s => s.textContent).join('\n');
    try {
        await navigator.clipboard.writeText(commands);
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => btn.textContent = '📋 Copy', 1500);
    } catch (err) {
        alert('Failed to copy: ' + err);
    }
});
</script>

</body>
</html>
